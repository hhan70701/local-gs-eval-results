  regions:
  - fg
  - oracle_fail
  - risk
  - rest
  - fail_vis2
  - fail_vis1
  vis_from: gs_tokf4rq_pix3_fsl448_pix3_al_local
  summary_variants:
  - cnw_cnn_mw
  - cnw_cnn_pix3_fsl
  - f4rq_pix3_fsl
  - f4rq_pix3bg_fsl
  - f4rq_pix3bg_fsl_g
  - f4rq_pix3bg_fsl_s25
  - f4rq_pix3bg_fsl_s50
  tto_main_variant: cnw_cnn
  ref_flow: flow_s1.0_pose
  fail_err_thresh: 0.08
  edge_thresh: 0.3
  edge_dilate_px: 5
  feather_sigma: 3.0
  object_dilate_px: 40
  reg_min_px: 2000
