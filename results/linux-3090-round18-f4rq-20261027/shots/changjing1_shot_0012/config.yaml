chroma:
  h_lo: 95
  h_hi: 130
  s_min: 10
  s_max: 110
  v_min: 50
  min_area_frac: 0.002
tokens:
  rife_scale: 1.0
  dis_preset: medium
  fb_thresh: 3.0
  fb_rel: 0.2
  photo_thresh: 0.08
  depth_thresh: 2.0
  fg_dilate_px: 15
  core_dilate_px: 6
  recon_margin_px: 48
  crop_pad_px: 32
  paste_feather_px: 8
  ring_px: 24
  primary: rife
  variants:
    rife:
      use_dis: false
      rife_warp: 0.2
      rife_col: 6.0
      depth: near_fail
      min_cc_px: 150
    cnw_cnn:
      external: data/tokens_cnw/{shot}/cnn
    cnw_f5:
      external: data/tokens_cnw/{shot}/f5
    f4rq:
      external: data/tokens_f4rq/{shot}/f4rq
  ring_max_disp_px: 20
  paste_fg_dilate_px: 15
calib:
  board_pattern: 北极星/biao_ding_9/grid_{:02d}.png
  board_inner:
  - 11
  - 8
  square_size: 1.0
  pair_max_gap: 4
  max_matches_per_pair: 600
  triangulate_max_err_px: 4.0
  per_cam_focal: false
  huber_px: 1.5
gs:
  sizes:
  - 448
  crops:
  - token
  roi_pad_px: 80
  roi_min_side: 448
  roi_window: null
  filter3d_var: 0.2
  filter3d_comp: false
  pose_sources:
  - aligned_int
  aligned_ref: 3
  aligned_pad_px: 160
  local_variants:
  - rife
  - cnw_cnn
  - cnw_f5
  multi_window:
    enabled: true
    max_side: 640
    max_windows: 4
    pad_px: 16
  render_full: false
  pixgs:
    enabled: true
    variants: []
    disp: data/disp_fs/{shot}
    sigma_px: 0.5
    max_stretch_px: 3.0
    eps2d: 0.3
    fill_px: 96
    depth_tol_px: 3.0
    skip_existing: true
    run_tokens:
    - f4rq
    edge_px: 1.0
    runs:
    - name: pix3_fsl
      method: pix3
      disp: data/disp_fs/{shot}
      mutual: true
      opt_steps: 100
    - name: pix3bg_fsl
      method: pix3
      disp: data/disp_fs/{shot}
      mutual: true
      opt_steps: 100
      bgplane: data/bgplane/{room}
      checkpoints:
      - 25
      - 50
    opt_lr:
      color: 0.02
      disp: 0.05
      opacity: 0.05
      scale: 0.01
    gate:
      runs:
      - pix3bg_fsl
      thr: 0.1
      blur_px: 3
      dilate_px: 8
  token_window: per_variant
  reproject:
    geometries: []
    sources:
    - aligned_int
    vis_tol: 0.05
    splat_scale: null
  tto:
    checkpoints:
    - 25
    - 50
    - 100
    crop:
      enabled: true
      margin_px: 32
      per_view: true
      quantile: 0.002
    scope: local
    max_res: 1008
    sh_rest: false
    ssim_weight: 0.2
    lr:
      means: 1.6e-05
      cov: 0.005
      opacity: 0.025
      dc: 0.0025
    max_disp_scale: 1.0
    max_cov_scale: 1.5
    cov_every: 10
  keep_mode: visible
  visible_tol: 0.03
  renders:
  - name: nat_dil
    res: native
    mode: classic
    eps2d: auto
    filter3d: false
risk:
  warp_thresh: 0.08
  col_thresh: 2.0
  dilate_px: 9
  fg_dilate_px: 15
eval:
  lean: true
  only_gs:
  - ^gs_tokcnw_cnn_pix3_fsl448_
  - ^gs_tokf4rq_(pix3|pix3bg)_fsl(_g|_s25|_s50)?448_
